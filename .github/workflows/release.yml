name: Release ServerProbe

on:
  push:
    tags: [ "v*" ]        # 推送 v 开头的标签时触发编译发布
  workflow_dispatch:       # 也允许在 GitHub Actions 页面手动触发

permissions:
  contents: write          # 创建 Release 需要写权限

jobs:
  # ---------- Go 探针：linux amd64 + arm64 ----------
  build-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build probe binaries (amd64 + arm64)
        working-directory: probe
        run: |
          mkdir -p pkg/amd64 pkg/arm64
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o pkg/amd64/serverprobe .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o pkg/arm64/serverprobe .
          # 打包：二进制 + 安装脚本 + systemd 单元
          # 资产名不含版本号，便于通过 releases/latest/download 固定链接引用（一键安装命令）
          cp install.sh pkg/amd64/ && cp -r systemd pkg/amd64/
          cp install.sh pkg/arm64/ && cp -r systemd pkg/arm64/
          tar -czf ../serverprobe-linux-amd64.tar.gz -C pkg/amd64 .
          tar -czf ../serverprobe-linux-arm64.tar.gz -C pkg/arm64 .

      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: |
            serverprobe-linux-*.tar.gz

  # ---------- Android App：armeabi-v7a + arm64-v8a ----------
  build-android:
    runs-on: ubuntu-latest
    env:
      # 正式签名：4 个环境变量，值取自仓库 Secrets（配置步骤见 README「发布签名」）
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify signing secrets
        run: |
          missing=""
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少签名环境变量:$missing —— 请在仓库 Settings → Secrets and variables → Actions 中配置（步骤见 README「发布签名」）"
            exit 1
          fi
          echo "签名环境变量已就绪，Android 正式包将使用环境变量中的 keystore 签名。"

      - name: Resolve app version
        id: appver
        run: |
          case "${GITHUB_REF}" in
            refs/tags/*) echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            *)           echo "value=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build release APKs
        working-directory: app-android
        env:
          APP_VERSION: ${{ steps.appver.outputs.value }}
        run: |
          chmod +x gradlew
          # 标签触发时以标签号作为版本名；手动触发（无标签）沿用 gradle 里的默认版本名
          ./gradlew assembleRelease ${APP_VERSION:+-PappVersion=$APP_VERSION} --no-daemon

      - name: Rename APKs
        working-directory: app-android/app/build/outputs/apk/release
        run: |
          mv app-arm64-v8a-release.apk ../../../../../Remoto-android-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk ../../../../../Remoto-android-armeabi-v7a.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: app-android/Remoto-android-*.apk

  # ---------- 发布 Release（含更新摘要）----------
  release:
    needs: [ build-probe, build-android ]
    # 仅标签触发时创建 Release；workflow_dispatch 手动触发只产出可下载的 APK 产物
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Extract release notes from CHANGELOG
        run: |
          TAG=${GITHUB_REF_NAME}
          awk -v t="$TAG" '
            $0 == "## " t { f=1; next }
            /^## / { if (f) exit }
            f { print }
          ' CHANGELOG.md > release-notes.md
          # 找不到对应章节时回退为标签信息/默认文案
          if [ ! -s release-notes.md ]; then
            git tag -l --format='%(contents)' "$TAG" > release-notes.md || true
          fi
          if [ ! -s release-notes.md ]; then
            echo "ServerProbe ${TAG} 发布版本。" > release-notes.md
          fi
          echo "----- release notes -----"
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "ServerProbe $TAG" \
            --notes-file release-notes.md \
            dist/* \
          || gh release upload "$TAG" dist/* --clobber
